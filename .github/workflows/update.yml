name: update-results
on:
  schedule:
    - cron: "45 9 * * *"    # 16:45 น. (ผลสลากกินแบ่งรัฐบาล)
    - cron: "15 14 * * 1-5" # 21:15 น. (ผลชุดรายวัน)
  workflow_dispatch: {}      # กดรันเองได้จากแท็บ Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_thai.py
      - run: python scripts/update_daily.py
      - name: commit
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update results $(date -u +%F)" && git push
